<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opening Harpoon…</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap">
  <style>
    :root { --violet: #6E3BD8; --bg: #FAF5EA; --ink: #1F1A2E; --muted: #686175; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    img { width: 120px; height: 120px; }
    h1 { font-family: Fredoka, system-ui, sans-serif; color: var(--violet); margin: 0; font-size: 34px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    a.btn { display: inline-block; background: var(--violet); color: #fff; text-decoration: none; font-weight: 600; padding: 10px 18px; border-radius: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="../icons/harpoon-512.png" alt="">
    <h1>Opening Harpoon…</h1>
    <p id="opening">Jumping to your target account board.</p>
    <div id="missing" hidden>
      <p>Looks like Harpoon isn't installed in this Chrome yet. It's a free Chrome extension that shows your team's target accounts on one board.</p>
      <p style="margin-top:14px"><a class="btn" href="https://github.com/georgepohl2-design/harpoon-for-hubspot-sales#install-it-no-coding-needed-about-5-minutes">How to install Harpoon</a></p>
    </div>
  </main>
  <script>
    // If Harpoon is installed, it opens the board and closes this tab straight away.
    // If this page is still here after a moment, Harpoon isn't installed.
    setTimeout(function () {
      document.getElementById('opening').hidden = true;
      document.getElementById('missing').hidden = false;
      document.querySelector('h1').textContent = 'Ahoy!';
    }, 1500);
  </script>
</body>
</html>
