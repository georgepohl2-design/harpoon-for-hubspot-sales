<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Harpoon cover</title>
<!-- Used once to render docs/cover.png for the README. Not part of the extension. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }
  body { width: 1600px; height: 900px; overflow: hidden; background: #6E3BD8; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { display: flex; align-items: center; gap: 18px; margin: 30px 0 4px; }
  header img { width: 104px; height: 104px; background: #FAF5EA; border-radius: 50%; }
  h1 { margin: 0; font-family: Fredoka, sans-serif; font-weight: 700; font-size: 84px; color: #fff; }
  p.tag { margin: 0 0 22px; color: #EFE7FB; font-size: 25px; font-weight: 500; }
  .frame { width: 1400px; height: 690px; border-radius: 16px; overflow: hidden; background: #FAF5EA; box-shadow: 0 24px 60px -20px rgba(0,0,0,.45); }
  .bar { height: 34px; background: #EEE7DA; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .bar i { width: 11px; height: 11px; border-radius: 50%; background: #D8CFC0; display: block; }
  .clip { width: 1400px; height: 656px; overflow: hidden; }
  iframe { width: 1600px; height: 750px; border: 0; transform: scale(.875); transform-origin: 0 0; }
</style>
</head>
<body>
  <header><img src="../icons/harpoon-512.png" alt=""><h1>Harpoon</h1></header>
  <p class="tag">Your top 100 target accounts on one board. A Slack nudge that gets sales on it.</p>
  <div class="frame"><div class="bar"><i></i><i></i><i></i></div><div class="clip"><iframe src="../board.html?clean"></iframe></div></div>
</body>
</html>
